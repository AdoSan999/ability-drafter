<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>GRIDSTUDIO - AD Draft Scanner</title>
    <style>
        :root {
            --bg: #0b0914;
            --surface: #130f1f;
            --surface-hover: #1b162b;
            --border: #251d38;
            --accent: #7b2cbf;
            --accent-hover: #9d4edd;
            --text: #ece8f8;
            --muted: #8c82a8;
            --green: #00f5d4;
            --pink: #ff4d8d;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка в стиле GridStudio */
        header {
            height: 52px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        .logo-box span { color: var(--accent); }
        .header-toolbar {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn.secondary { background: var(--surface-hover); border: 1px solid var(--border); color: var(--text); }
        .btn.secondary:hover { background: #241d38; }
        input[type="file"] { display: none; }

        /* Основной воркспейс */
        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Левая панель инструментов */
        aside {
            width: 64px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
        }
        .tool-icon {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
            border: none;
            font-size: 18px;
        }
        .tool-icon:hover, .tool-icon.active {
            background: var(--surface-hover);
            color: var(--text);
        }

        /* Центр с холстом */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: radial-gradient(circle at center, #130f1f 0%, #0b0914 100%);
        }
        .canvas-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 100%;
        }
        canvas {
            max-height: calc(100vh - 160px);
            width: auto;
            border-radius: 6px;
            background: #000;
        }

        /* Футер */
        footer {
            height: 36px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 12px;
            color: var(--muted);
        }
        .footer-group { display: flex; gap: 16px; align-items: center; }

        /* Правая выдвижная панель страт */
        .sidebar-right {
            width: 320px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            overflow-y: auto;
        }
        .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .combo-card {
            background: var(--surface-hover);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            border-radius: 6px;
        }
        .combo-card.meme { border-left-color: var(--pink); }
        .combo-title { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
        .combo-desc { font-size: 11px; color: var(--muted); }
        
        .slots-preview {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            background: #0b0914;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            max-height: 180px;
            overflow-y: auto;
        }
        .slots-preview canvas { width: 100%; height: auto; border-radius: 3px; aspect-ratio: 1; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            GRIDSTUDIO <span>DOTA 2 AD TOOLKIT</span>
        </div>
        <div class="header-toolbar">
            <label class="btn">
                📁 Загрузить скрин
                <input type="file" id="fileInput" accept="image/*">
            </label>
            <button class="btn" id="captureBtn">🖥️ Захват экрана</button>
            <button class="btn secondary" id="toggleGridBtn">📐 Сетка: ВКЛ</button>
        </div>
    </header>

    <!-- Основное рабочее пространство -->
    <div class="main-container">
        <!-- Левый паллет иконок -->
        <aside>
            <button class="tool-icon active" title="Холст">🖼️</button>
            <button class="tool-icon" title="Сетка">📐</button>
            <button class="tool-icon" title="Комбо">⚡</button>
        </aside>

        <!-- Центр с холстом 16:9 -->
        <div class="canvas-area">
            <div class="canvas-wrapper">
                <canvas id="mainCanvas" width="1920" height="1080"></canvas>
            </div>
        </div>

        <!-- Правый сайдбар со стратами -->
        <div class="sidebar-right">
            <div class="section-title">Распознанные слоты (48)</div>
            <div class="slots-preview" id="slotsPreview"></div>

            <div class="section-title" style="margin-top: 8px;">Анализ и связки</div>
            <div class="combo-card">
                <div class="combo-title">🔥 Топ-синергия</div>
                <div class="combo-desc">Интерфейс переведен на 16:9 Pro. Ползунки полностью удалены, сетка встает на пирамиду автоматически.</div>
            </div>
            <div class="combo-card meme">
                <div class="combo-title">🤡 Мем-билд</div>
                <div class="combo-desc">Ожидание кадра с экрана...</div>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer>
        <div class="footer-group">
            <span>Статус: Готов к работе (16:9)</span>
        </div>
        <div class="footer-group">
            <span>v1.0.5 Pro</span>
        </div>
    </footer>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const slotsPreview = document.getElementById('slotsPreview');
    let currentImage = null;
    let showGrid = true;

    function drawPlaceholder() {
        canvas.width = 1920;
        canvas.height = 1080;
        ctx.fillStyle = '#0b0914';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#8c82a8';
        ctx.font = '32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Нет активного кадра драфта', canvas.width/2, canvas.height/2 - 20);
        ctx.font = '18px sans-serif';
        ctx.fillText('Загрузи скриншот или начни захват окна Доты вверху', canvas.width/2, canvas.height/2 + 20);
    }
    drawPlaceholder();

    // Жесткие координаты под 16:9 без ползунков
    function getGridCoords(w, h) {
        const slots = [];
        const ultStartX = w * 0.405;
        const ultStartY = h * 0.132;
        const ultSize = w * 0.030;
        const ultGapX = w * 0.036;
        const ultGapY = h * 0.065;

        for (let r = 0; r < 2; r++) {
            for (let c = 0; c < 6; c++) {
                const perspX = (c - 2.5) * r * (w * 0.0006);
                slots.push({ type: 'ult', x: ultStartX + c * ultGapX + perspX, y: ultStartY + r * ultGapY, w: ultSize, h: ultSize });
            }
        }

        const basicStartY = h * 0.265;
        const leftStartX = w * 0.345;
        const rightStartX = w * 0.530;
        const bSize = w * 0.029;
        const bGapX = w * 0.035;
        const bGapY = h * 0.058;

        [leftStartX, rightStartX].forEach((baseX, blockIdx) => {
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 3; c++) {
                    const globalCol = blockIdx === 0 ? (c - 3) : (c + 0.5);
                    const perspX = globalCol * r * (w * 0.0007);
                    slots.push({ type: 'basic', x: baseX + c * bGapX + perspX, y: basicStartY + r * bGapY, w: bSize, h: bSize });
                }
            }
        });
        return slots;
    }

    function render() {
        if (!currentImage) return;
        canvas.width = currentImage.width || currentImage.videoWidth || 1920;
        canvas.height = currentImage.height || currentImage.videoHeight || 1080;

        ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

        const slots = getGridCoords(canvas.width, canvas.height);
        slotsPreview.innerHTML = '';

        slots.forEach((slot) => {
            const mini = document.createElement('canvas');
            mini.width = 32;
            mini.height = 32;
            const mCtx = mini.getContext('2d');
            mCtx.drawImage(canvas, slot.x + slot.w * 0.15, slot.y + slot.h * 0.15, slot.w * 0.7, slot.h * 0.7, 0, 0, 32, 32);
            slotsPreview.appendChild(mini);

            if (showGrid) {
                ctx.strokeStyle = slot.type === 'ult' ? '#ff4d8d' : '#00f5d4';
                ctx.lineWidth = Math.max(2, canvas.width * 0.002);
                ctx.strokeRect(slot.x, slot.y, slot.w, slot.h);
            }
        });
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const img = new Image();
        img.onload = () => { currentImage = img; render(); };
        img.src = URL.createObjectURL(file);
    });

    document.getElementById('captureBtn').addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();
            currentImage = video;
            setInterval(render, 1000);
        } catch (err) {
            alert('Не удалось захватить экран: ' + err.message);
        }
    });

    document.getElementById('toggleGridBtn').addEventListener('click', (e) => {
        showGrid = !showGrid;
        e.target.textContent = `📐 Сетка: ${showGrid ? 'ВКЛ' : 'ВЫКЛ'}`;
        render();
    });
</script>
</body>
</html>
