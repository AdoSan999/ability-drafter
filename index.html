<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AD Draft Scanner & Combo Finder</title>
    <style>
        :root {
            --bg: #110e1b;
            --card: #1b162b;
            --accent: #8a2be2;
            --accent-hover: #a14ef0;
            --text: #ece8f8;
            --muted: #988fb3;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 0 0 8px; font-size: 22px; }
        .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        button, label.btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover, label.btn:hover { background: var(--accent-hover); }
        button.secondary { background: #2b2342; }
        button.secondary:hover { background: #3a3057; }
        input[type="file"] { display: none; }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            max-width: 1300px;
            width: 100%;
        }
        @media (max-width: 960px) {
            .workspace { grid-template-columns: 1fr; }
        }
        .canvas-box {
            background: var(--card);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #2d2447;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            background: #09070f;
        }
        .panel {
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #2d2447;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .combo-card {
            background: #241d38;
            border-left: 4px solid var(--accent);
            padding: 10px 12px;
            border-radius: 6px;
        }
        .combo-card.meme { border-left-color: #ff4d8d; }
        .combo-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
        .combo-desc { font-size: 12px; color: var(--muted); }
        .slots-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 220px;
            overflow-y: auto;
            padding: 6px;
            background: #130f1f;
            border-radius: 6px;
        }
        .slots-preview canvas { width: 32px; height: 32px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>AD Draft Scanner & Combo Finder</h1>
    <div class="subtitle">Автоматический сканер драфта • Без ручных настроек</div>

    <div class="toolbar">
        <label class="btn">
            📁 Загрузить скриншот драфта
            <input type="file" id="fileInput" accept="image/*">
        </label>
        <button id="captureBtn">🖥️ Захватить окно Доты</button>
        <button class="secondary" id="toggleGridBtn">📐 Сетка слотов: ВКЛ</button>
        <button class="secondary" id="pipBtn">🪟 Оверлей (PiP)</button>
    </div>

    <div class="workspace">
        <div class="canvas-box">
            <canvas id="mainCanvas" width="1024" height="576"></canvas>
        </div>

        <div class="panel">
            <div>
                <strong>2. Вырезанные слоты (48 скиллов)</strong>
                <div class="slots-preview" id="slotsPreview"></div>
            </div>

            <div id="combosContainer">
                <strong>3. Анализ драфта и связки</strong>
                <div class="combo-card" style="margin-top:8px;">
                    <div class="combo-title">🎯 Сканер готов</div>
                    <div class="combo-desc">Сетка теперь привязана автоматически и встает строго на иконки. Закинь скриншот для проверки!</div>
                </div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const slotsPreview = document.getElementById('slotsPreview');
    let currentImage = null;
    let showGrid = true;

    // Автоматический расчет сетки без ползунков под точную геометрию АД
    function getGridCoords(w, h) {
        const slots = [];

        // 1. Ульты: сверху (2 ряда по 6 слотов)
        const ultStartX = w * 0.405;
        const ultStartY = h * 0.132;
        const ultSize = w * 0.030;
        const ultGapX = w * 0.036;
        const ultGapY = h * 0.065;

        for (let r = 0; r < 2; r++) {
            for (let c = 0; c < 6; c++) {
                const perspX = (c - 2.5) * r * (w * 0.0006);
                slots.push({
                    type: 'ult',
                    x: ultStartX + c * ultGapX + perspX,
                    y: ultStartY + r * ultGapY,
                    w: ultSize,
                    h: ultSize
                });
            }
        }

        // 2. Обычные скиллы: 2 блока по 6 рядов x 3 колонки
        const basicStartY = h * 0.265;
        const leftStartX = w * 0.345;
        const rightStartX = w * 0.530;
        const bSize = w * 0.029;
        const bGapX = w * 0.035;
        const bGapY = h * 0.058;

        [leftStartX, rightStartX].forEach((baseX, blockIdx) => {
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 3; c++) {
                    const globalCol = blockIdx === 0 ? (c - 3) : (c + 0.5);
                    const perspX = globalCol * r * (w * 0.0007);
                    slots.push({
                        type: 'basic',
                        x: baseX + c * bGapX + perspX,
                        y: basicStartY + r * bGapY,
                        w: bSize,
                        h: bSize
                    });
                }
            }
        });

        return slots;
    }

    function render() {
        if (!currentImage) return;
        canvas.width = currentImage.width || currentImage.videoWidth || 1024;
        canvas.height = currentImage.height || currentImage.videoHeight || 576;

        ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

        const slots = getGridCoords(canvas.width, canvas.height);
        slotsPreview.innerHTML = '';

        slots.forEach((slot) => {
            const mini = document.createElement('canvas');
            mini.width = 32;
            mini.height = 32;
            const mCtx = mini.getContext('2d');
            mCtx.drawImage(
                canvas,
                slot.x + slot.w * 0.15,
                slot.y + slot.h * 0.15,
                slot.w * 0.7,
                slot.h * 0.7,
                0, 0, 32, 32
            );
            slotsPreview.appendChild(mini);

            if (showGrid) {
                ctx.strokeStyle = slot.type === 'ult' ? '#ff4d8d' : '#00f5d4';
                ctx.lineWidth = Math.max(2, canvas.width * 0.002);
                ctx.strokeRect(slot.x, slot.y, slot.w, slot.h);
            }
        });
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const img = new Image();
        img.onload = () => {
            currentImage = img;
            render();
        };
        img.src = URL.createObjectURL(file);
    });

    document.getElementById('captureBtn').addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();
            currentImage = video;
            setInterval(render, 1000);
        } catch (err) {
            alert('Не удалось захватить экран: ' + err.message);
        }
    });

    document.getElementById('toggleGridBtn').addEventListener('click', (e) => {
        showGrid = !showGrid;
        e.target.textContent = `📐 Сетка слотов: ${showGrid ? 'ВКЛ' : 'ВЫКЛ'}`;
        render();
    });

    document.getElementById('pipBtn').addEventListener('click', async () => {
        if (!('documentPictureInPicture' in window)) {
            alert('Твой браузер не поддерживает Document PiP. Попробуй открыть в Microsoft Edge!');
            return;
        }
        const pipWin = await documentPictureInPicture.requestWindow({ width: 340, height: 260 });
        pipWin.document.body.style.background = '#110e1b';
        pipWin.document.body.style.color = '#ece8f8';
        pipWin.document.body.style.fontFamily = 'sans-serif';
        pipWin.document.body.style.padding = '12px';
        pipWin.document.body.innerHTML = document.getElementById('combosContainer').innerHTML;
    });
</script>
</body>
</html>
